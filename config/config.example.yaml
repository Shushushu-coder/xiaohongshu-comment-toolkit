# 小红书爬虫系统配置文件 (远程调试模式优化版)
# 最后更新: 2025-11-02
# 模式: 远程调试模式 (Remote Debug Mode)

# ==================== 账号配置 ====================
accounts:
  - phone: "***78848565"
    password: ""  # 远程调试模式下可留空，手动登录
    cookie_file: "cookies/xiaohongshu_cookies.json"  # 可选，不必须

# ==================== 爬虫配置 ====================
scraper:
  # 目标品牌
  brand_name: "谷雨"
  
  # 搜索配置
  search:
    max_notes: 50              # 最多爬取的笔记数量
    search_type: "综合"         # 搜索类型: 综合/最新/最热
  
  # 延迟配置(秒) - 模拟人类操作
  delays:
    page_load:                 # 页面加载等待
      min: 3
      max: 8
    scroll:                    # 滚动延迟
      min: 1
      max: 3
    click:                     # 点击延迟
      min: 2
      max: 5
    read_comment:              # 阅读评论延迟
      min: 0.5
      max: 2
    search:                    # 搜索后等待
      min: 5
      max: 10
  
  # ⭐ 远程调试模式配置 (新增)
  remote_debug:
    enabled: true              # 启用远程调试模式
    port: 9222                 # Chrome调试端口
    host: "127.0.0.1"         # 调试地址
    
  # 浏览器配置 (远程调试模式下简化)
  browser:
    # 注意: 远程调试模式下，以下配置由启动脚本控制
    headless: false           # 必须为 false (远程调试不支持headless)
    window_size: "1920,1080"  # 在启动脚本中设置
    # user_agent: 由真实Chrome决定，无需配置 ✅
  
  # 登录配置 (远程调试模式简化)
  login:
    method: "manual"          # 远程调试模式: 强制使用manual (手动登录)
    auto_save: false          # 远程调试模式不需要自动保存cookie
    # cookie_file: 可选，不影响登录
  
  # 评论抓取配置
  comments:
    max_per_note: 100         # 每个笔记最多抓取的评论数
    load_more_times: 5        # 点击"加载更多"的次数
    include_replies: true     # 是否包含回复
  
  # 重试配置
  max_retries: 3              # 最大重试次数
  retry_delay: 60             # 重试延迟(秒)
  
  # 反爬虫策略 (远程调试模式优化)
  anti_detection:
    random_scroll: true       # 随机滚动
    mouse_movement: true      # 模拟鼠标移动
    bezier_curve: true        # 贝塞尔曲线移动
    pause_on_captcha: true    # 遇到验证码时暂停
    # 注意: 远程调试模式本身就有很强的反检测能力 ✅
  
  # 调试模式
  debug_mode: false           # 调试模式(会打印更多信息)
  save_screenshots: true      # 保存截图
  screenshot_dir: "data/screenshots"

# ==================== 用户可信度评分配置 ====================
credibility:
  enabled: true               # 启用可信度过滤
  threshold: 0.6              # 可信度阈值(0-1之间)
  
  # 各维度权重(总和应为1.0)
  weights:
    account_age: 0.20         # 账号年龄
    content_diversity: 0.25   # 内容多样性
    engagement_ratio: 0.15    # 互动比例
    posting_pattern: 0.20     # 发布模式
    follower_quality: 0.20    # 粉丝质量
  
  # 账号年龄评分参数
  account_age:
    max_days: 730             # 最大天数(2年)
    min_days: 30              # 最小天数
  
  # 内容多样性评分参数
  content_diversity:
    min_categories: 1         # 最少类别数
    max_categories: 5         # 最多类别数
  
  # 互动比例评分参数
  engagement_ratio:
    normal_range:
      min: 10
      max: 1000
    low_penalty: 0.5          # 低互动惩罚系数
    high_penalty: 0.3         # 高互动惩罚系数
  
  # 发布模式评分参数
  posting_pattern:
    min_variance: 1           # 最小时间方差(小时)
    max_variance: 24          # 最大时间方差
  
  # 粉丝质量评分参数
  follower_quality:
    normal_ratio:
      min: 0.5
      max: 10
    zero_follower_score: 0.3  # 零粉丝账号得分

# ==================== 评论质量过滤配置 ====================
comment_filter:
  enabled: true               # 启用评论过滤
  min_length: 5               # 最小长度
  max_length: 500             # 最大长度
  
  # 排除的关键词(营销词汇)
  exclude_keywords:
    - "加v"
    - "加微信"
    - "私信"
    - "链接"
    - "淘宝"
    - "拼多多"
    - "代购"
    - "团购"
    - "优惠券"
    - "返现"
  
  # 排除的模式(正则表达式)
  exclude_patterns:
    - '\d{5,}'                # 长数字
    - '[a-zA-Z0-9]{10,}'      # 长字母数字串
  
  # 去重配置
  deduplicate: true
  similarity_threshold: 0.9   # 相似度阈值

# ==================== 数据输出配置 ====================
output:
  base_dir: "data"
  
  directories:
    raw_comments: "raw_comments"
    filtered_comments: "filtered"
    user_profiles: "user_profiles"
    reports: "reports"
    screenshots: "screenshots"
    backups: "backups"
  
  formats:
    comments: "json"          # json/csv
    users: "json"             # json/csv
    reports: "markdown"       # markdown/html
  
  # 自动备份
  auto_backup: true
  backup_interval: 3600       # 备份间隔(秒)
  keep_backups: 5            # 保留备份数量

# ==================== 日志配置 ====================
logging:
  level: "INFO"               # DEBUG/INFO/WARNING/ERROR/CRITICAL
  directory: "logs"
  name: "XiaohongshuScraper"
  console_output: true
  file_output: true
  color_output: true
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  max_size: 10485760          # 10MB
  backup_count: 5

# ==================== 数据分析配置 ====================
analysis:
  sentiment:
    enabled: true
    language: "zh"
  
  keywords:
    enabled: true
    top_n: 20
    min_freq: 3
  
  statistics:
    enabled: true
    include_charts: true
  
  export_format: "markdown"

# ==================== 代理配置(可选) ====================
# 注意: 远程调试模式下，代理应在启动Chrome时配置
proxy:
  enabled: false              # 建议关闭，在启动脚本中配置
  type: "http"
  host: "127.0.0.1"
  port: 7890
  username: ""
  password: ""

# ==================== 通知配置(可选) ====================
notification:
  enabled: false
  method: "webhook"
  
  webhook:
    url: ""
    secret: ""
  
  events:
    on_start: false
    on_complete: true
    on_error: true

# ==================== 性能配置 ====================
performance:
  # 注意: 远程调试模式建议关闭并发
  concurrent:
    enabled: false            # 强烈建议保持false
    max_workers: 1
  
  cache:
    enabled: true
    cache_dir: "cache"
    ttl: 86400               # 缓存有效期(秒)
  
  database:
    enabled: false
    type: "sqlite"
    path: "data/scraper.db"

# ==================== 远程调试模式说明 ====================
# 
# 🎯 远程调试模式优势:
# ✅ 无需ChromeDriver - 避免版本冲突
# ✅ 更强的反检测能力 - 使用真实浏览器
# ✅ 手动登录更安全 - 避免cookie失效
# ✅ 稳定性更高 - 不依赖自动化驱动
#
# 📝 使用流程:
# 1. 运行: start_xiaohongshu_chrome.bat
# 2. 在打开的Chrome中手动登录小红书
# 3. 运行: python main.py
#
# ⚠️  注意事项:
# - 必须先启动调试Chrome，再运行爬虫
# - 不支持headless模式
# - 代理需要在启动脚本中配置
# - 登录方式固定为手动登录